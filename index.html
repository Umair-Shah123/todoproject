<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<h2 class=" ml-6 font-bold text-xl">Todo App</h2>

<form class=" border px-2 " method="POST">
    
    {% csrf_token %}
    {{ form.title }}
    <button class="border px-2 border-rouded font-bold bg-gray-300 " type="submit">Add</button>
</form>

<hr >

{% for task in tasks %}
    <p class="mt-3 border px-5">
        {{ task.title }}

        <a class="border px-2 font-bold bg-gray-300" href="/update/{{ task.id }}">Edit</a>
        <a  class="border px-2 font-bold bg-gray-300" href="/delete/{{ task.id }}">Delete</a>
    </p>
{% endfor %}

</body>
</html>
